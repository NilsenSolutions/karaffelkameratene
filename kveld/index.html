<!doctype html>
<html lang="nb" data-tema="kamerater" data-fast-tema>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kveldsmodus – Karaffelkameratene</title>
  <meta name="description" content="Smakeskjema for kvelden: noter aromaer, struktur og poeng, og gjett vinene i blinde.">
  <meta name="theme-color" content="#eef3ea">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Karaffel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    // Samme tema som forsiden, valgt før siden tegnes. felles.js henter det lagrede valget etterpå.
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get("tema") || localStorage.getItem("karaffel-tema"); } catch (e) {}
      if (t === "kamerater") document.documentElement.setAttribute("data-tema", t);
    })();
  </script>
  <link rel="stylesheet" href="../style.css?v=20261023r">
  <link rel="stylesheet" href="kveld.css?v=20261023r">
  <link rel="stylesheet" href="../tema.css?v=20261023r">
</head>
<body class="kveld">
  <header class="topp">
    <a class="merke" href="../">Karaffelkameratene</a>
    <span class="kveld-merke">Kveldsmodus</span>
  </header>

  <main>
    <p class="melding" id="melding" role="status" hidden></p>

    <section class="kveld-intro">
      <h1 id="kveld-tittel">Kveldsmodus</h1>
      <p class="kveld-info" id="kveld-info">Henter kvelden…</p>
    </section>

    <p class="kort" id="ingen" hidden>Ingen smaking er aktiv akkurat nå. Siden oppdaterer seg selv når verten har lagt inn kvelden.</p>

    <div id="innhold" hidden>
      <div class="felt kveld-navn">
        <label for="navn">Navnet ditt <span class="valgfri">Vises i rangeringen</span></label>
        <input id="navn" type="text" autocomplete="given-name" maxlength="40" placeholder="For eksempel Kari">
      </div>

      <nav class="faner" aria-label="Viner" id="faner"></nav>

      <section class="panel" id="panel" aria-live="polite"></section>
    </div>
  </main>

  <footer class="bunn">
    <p>Notater blir på telefonen. Gjetninger og poeng sendes til verten.</p>
  </footer>

  <script src="oppsett.js?v=20261023r"></script>
  <script src="felles.js?v=20261023r"></script>
  <script src="kveld.js?v=20261023r"></script>
</body>
</html>
