<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaffelkameratene</title>
  <meta name="theme-color" content="#eef3ea">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Karaffel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Åpnet fra hjemskjermen: gå rett til gjengen. Alle som lagret siden før gjengene kom, hører til ggmm.
    if (window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) {
      var siste = null;
      try { siste = localStorage.getItem("karaffel-siste-gjeng"); } catch (e) { /* privat modus */ }
      location.replace("/" + (siste || "ggmm"));
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box; background: #eef3ea; }
    h1 { margin: 0; font: 400 clamp(2.2rem, 9vw, 6rem)/1.05 "Permanent Marker", cursive; color: #2f5ba8; text-align: center; transform: rotate(-2deg); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Karaffelkameratene</h1>
</body>
</html>
