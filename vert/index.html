<!doctype html>
<html lang="nb" data-tema="kamerater" data-fast-tema>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertskap – Karaffelkameratene</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eef3ea">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=20261024s">
  <link rel="stylesheet" href="../kveld/kveld.css?v=20261024s">
  <link rel="stylesheet" href="../smaking/smaking.css?v=20261024s">
  <link rel="stylesheet" href="styring.css?v=20261024s">
  <link rel="stylesheet" href="../tema.css?v=20261024s">
</head>
<body class="kveld styring">
  <header class="topp">
    <a class="merke" href="../">Karaffelkameratene</a>
    <span class="kveld-merke">Vertskap</span>
  </header>

  <main>
    <p class="melding" id="melding" role="status" hidden></p>

    <form class="kort" id="logg-inn" hidden>
      <h1>For vertskapet</h1>
      <div class="felt">
        <label for="pin">PIN</label>
        <input id="pin" type="password" autocomplete="current-password" required>
      </div>
      <button class="knapp" type="submit">Logg inn</button>
      <p class="feil" id="pin-feil" role="alert"></p>
    </form>

    <div id="styring" hidden>
      <div id="innhold"></div>
      <button class="lenkeknapp" type="button" id="logg-ut">Logg ut</button>
    </div>
  </main>

  <script src="../kveld/oppsett.js?v=20261024s"></script>
  <script src="../kveld/felles.js?v=20261024s"></script>
  <script src="../kveld/vinfelt.js?v=20261024s"></script>
  <script src="styring.js?v=20261024s"></script>
</body>
</html>
